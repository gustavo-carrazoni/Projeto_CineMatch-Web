<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="CineMatch Web: personalize suas preferências de séries e descubra um catálogo de conteúdos de acordo com seus gêneros favoritos.">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="./css/style.css"/>
    <title>- CineMatch Web -</title>
  </head>

  <body>
    <main class="container">        
            <header class="header">
                    <div id="menu_usuario" aria-label="Menu do usuário">    
                        <h2>- CineMatch Web -</h2><br/>
                        
                        <button type="button" id="mostrar_catalogo_comp">Mostrar Catálogo Completo</button>
                        <button type="button" id="trocar_usuario">Trocar Usuário</button>
                        
                    </div>
            </header>
    <div id="conteudo_principal" class="conteudoPrincipal">
        <section class="welcomeMessage"></section>
        <form id="form-perfil">
        <h2>Cadastro de Usuário</h2>
        
        <legend>Dados pessoais</legend>  
        <section id="dados_pessoais" aria-label="Dados pessoais">
            <span class="obrig">*</span><label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required aria-required="true"/>

            
            <span class="obrig">*</span><label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required aria-required="true"/>

            <span class="obrig">*</span><label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" min="1930-01-01" autocomplete="data_nascimento" required aria-required="true"/>   
        </section>

            <legend>Gêneros favoritos</legend>
            <section id="generos_select" aria-label="Selecione os gêneros que você gosta">
            <label><input type="checkbox" name="genero" value="Drama"/> Drama</label>

            <label><input type="checkbox" name="genero" value="Comedy"/> Comédia</label>

            <label><input type="checkbox" name="genero" value="Action"/> Ação</label>

            <label><input type="checkbox" name="genero" value="Adventure"/> Aventura</label>

            <label><input type="checkbox" name="genero" value="Fantasy"/> Fantasia</label>

            <label><input type="checkbox" name="genero" value="Romance"/> Romance</label>

            <label><input type="checkbox" name="genero" value="Thriller"/> Suspense</label>

            <label><input type="checkbox" name="genero" value="Horror"/> Terror</label>

            <label><input type="checkbox" name="genero" value="Documentary"/> Documentário</label>

            <label><input type="checkbox" name="genero" value="Science-Fiction"/> Ficção Científica</label>

            <label><input type="checkbox" name="genero" value="Anime"/> Anime</label>

            <label><input type="checkbox" name="genero" value="Crime"/> Crime</label>
        </section>
        <button type="submit" name="cadastro_user">Salvar cadastro</button>
        </form>
      
        <div id="popup" class="popup"></div>  
        
        <section class="catalogo">
            <h2 id="titulo_catalogo">Catálogo de Séries</h2>
            <div id="lista_series" class="listaSeries"></div>
                <div id="popup_resumo" class="popupResumo"></div>
        </section>
    </div>
    </main>
   <script type="module" src="./js/script.js"></script> 
  </body>
</html>
