<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="./css/style.css"/>
    <title>- CineMatch Web -</title>
  </head>

  <body>
    <main class="container">
        <section class="hero">
            <header>
                <div id="menuUsuario"><nav>
                    <h2>- Menu -</h2><br/>
                    <ul>
                        <li>Alterar Preferências</li>
                        <li>Mostrar recomendações</li>
                        <li>Trocar Usuário</li>
                    </ul></div>
                </nav>
            </header>
            <h1>CineMatch</h1>
        </section>
    <section class="welcomeMessage"></section>
        <form id="form-perfil">
        <h2>Cadastro de Usuário</h2>
        
        <legend>Dados pessoais</legend>  
        <section id="dados_pessoais">
            <span class="obrig">*</span><label for="email">E-mail</label>
            <input type="text" id="email" name="email" required/>

            
            <span class="obrig">*</span><label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required/>

            <span class="obrig">*</span><label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" min="1930-01-01" required/>   
        </section>

            <legend>Gêneros favoritos</legend>
            <section id="generos_select">
            <label><input type="checkbox" name="genero" value="Drama"/> Drama</label>

            <label><input type="checkbox" name="genero" value="Comedia"/> Comédia</label>

            <label><input type="checkbox" name="genero" value="Acao"/> Ação</label>

            <label><input type="checkbox" name="genero" value="Aventura"/> Aventura</label>

            <label><input type="checkbox" name="genero" value="Fantasia"/> Fantasia</label>

            <label><input type="checkbox" name="genero" value="Romance"/> Romance</label>

            <label><input type="checkbox" name="genero" value="Suspense"/> Suspense</label>

            <label><input type="checkbox" name="genero" value="Terror"/> Terror</label>

            <label><input type="checkbox" name="genero" value="Documentário"/> Documentário</label>

            <label><input type="checkbox" name="genero" value="Ficcao"/> Ficção Científica</label>
        </section>
        <button type="submit" name="cadastro_user">Salvar cadastro</button>
        </form>
      
        <div id="popup" class="popup"></div>  
        
        <section class="catalogo">
            <h2>Catálogo de Séries</h2>
            <div id="listaSeries" class="listaSeries"></div>
                <div id="popupResumo" class="popupResumo"></div>
        </section>


    </main>
   <script type="module" src="./js/script.js"></script> 
  </body>
</html>
